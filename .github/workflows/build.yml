name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build WSL binaries and checksums
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "-X main.version=$RELEASE_TAG" \
              -o "dist/lumiqo-manager-linux-$arch" .
          done
          cd dist
          sha256sum lumiqo-manager-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: lumiqo-manager-linux
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: lumiqo-manager-linux
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/lumiqo-manager-linux-amd64 dist/lumiqo-manager-linux-arm64 dist/SHA256SUMS
